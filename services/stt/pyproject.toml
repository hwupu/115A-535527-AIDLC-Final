[project]
name = "triage-stt"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.2.1",
    "opencc-python-reimplemented>=0.1.7",
    "av>=14,<17",
]

[dependency-groups]
# CUDA 12 libraries for CTranslate2 on an NVIDIA GPU; installed only when the image is built with STT_GPU=1.
gpu = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1,<10",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

# Not a distributable package: uv only manages the environment.
[tool.uv]
package = false
