# Profiles: dev = vite hot reload; demo = built web served by nginx.
# `docker compose up` uses COMPOSE_PROFILES from .env (default in .env.example: dev).
# CP2 local candidate: real local models (Whisper, Ollama), model caches persisted in volumes.
services:
  web:
    profiles: [dev]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-5173}:5173"]
    volumes: ["./apps/web/src:/repo/apps/web/src"]
    environment:
      VITE_API_MOCK: ${VITE_API_MOCK:-0}
    depends_on: { api: { condition: service_healthy }, llm: { condition: service_healthy } }
  web-demo:
    profiles: [demo]
    # VITE_* values are baked in at build time, so the mock flag is passed as a build arg.
    build: { context: ., dockerfile: apps/web/Dockerfile.demo, args: { VITE_API_MOCK: "${VITE_API_MOCK:-0}" } }
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on: { api: { condition: service_healthy }, llm: { condition: service_healthy } }
  api:
    build: services/api
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: ["cp2-api-data:/srv/data"]
    environment:
      LLM_URL: http://llm:8000
      STT_URL: http://stt:8000
      EVAL_MODE: ${EVAL_MODE:-0}
    # Web waits for this so the first /api request doesn't hit a 502 while uvicorn starts.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
  stt:
    build: services/stt
    ports: ["127.0.0.1:${STT_PORT:-8001}:8000"]
    volumes: ["cp2-stt-cache:/srv/data"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
  llm:
    build: services/llm
    ports: ["127.0.0.1:${LLM_PORT:-8002}:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma3:1b}
    depends_on: { ollama-pull: { condition: service_completed_successfully } }
    # /ready turns 200 after one warm-up extraction (or its failure), so the first nurse turn is not a cold start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 2s
      retries: 100
  # Extraction model runtime. CPU by default; on a machine with an NVIDIA GPU add docker-compose.gpu.yml.
  ollama:
    image: ollama/ollama:0.33.2
    volumes: ["ollama-models:/root/.ollama"]
    environment:
      # The first request after loading takes over a minute; keep the model in memory between demo turns.
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
  # One-shot: download LLM_MODEL into the volume (quick once it is there), then exit.
  ollama-pull:
    image: ollama/ollama:0.33.2
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-gemma3:1b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: { ollama: { condition: service_healthy } }

volumes:
  cp2-api-data:
  cp2-stt-cache:
  ollama-models:
