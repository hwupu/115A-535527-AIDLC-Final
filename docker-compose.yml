# Profiles: dev = vite hot reload; demo = built web served by nginx.
# `docker compose up` uses COMPOSE_PROFILES from .env (default in .env.example: dev).
# CP2 local candidate: real CPU models, model caches persisted in volumes.
services:
  web:
    profiles: [dev]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-5173}:5173"]
    volumes: ["./apps/web/src:/repo/apps/web/src"]
    environment:
      VITE_API_MOCK: ${VITE_API_MOCK:-0}
    depends_on: { api: { condition: service_healthy } }
  web-demo:
    profiles: [demo]
    # VITE_* values are baked in at build time, so the mock flag is passed as a build arg.
    build: { context: ., dockerfile: apps/web/Dockerfile.demo, args: { VITE_API_MOCK: "${VITE_API_MOCK:-0}" } }
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on: { api: { condition: service_healthy } }
  api:
    build: services/api
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: ["cp2-api-data:/srv/data"]
    environment:
      LLM_URL: http://llm:8000
      STT_URL: http://stt:8000
      EVAL_MODE: ${EVAL_MODE:-0}
    # Web waits for this so the first /api request doesn't hit a 502 while uvicorn starts.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
  stt:
    build: services/stt
    ports: ["127.0.0.1:${STT_PORT:-8001}:8000"]
    volumes: ["cp2-stt-cache:/srv/data"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
  llm:
    build: services/llm
    ports: ["127.0.0.1:${LLM_PORT:-8002}:8000"]
    volumes: ["cp2-llm-cache:/srv/data"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}

volumes:
  cp2-api-data:
  cp2-stt-cache:
  cp2-llm-cache:
